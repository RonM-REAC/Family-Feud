<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JACKPOT — Game Board</title><link rel="stylesheet" href="css/jackpot.css"></head>
<body class="jp-body"><main class="jp-board" id="app"><header class="jp-header"><div class="jp-brand">🎯 JACKPOT</div><div class="jp-turn" id="turnLabel">PLAYER 1'S TURN</div></header>

<footer class="jp-footer"><div class="jp-timer"><span class="jp-timer-label">TIME</span><strong id="timer">20</strong></div><div class="jp-scores"><div class="jp-score"><span>PLAYER 1</span><strong id="score1">0</strong></div><div class="jp-score"><span>PLAYER 2</span><strong id="score2">0</strong></div></div></footer><div class="jp-status" id="status">Waiting for admin controls…</div></main>
