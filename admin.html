<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Feud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="admin">
  <header class="nav">
    <a class="brand" href="index.html">FAMILY FEUD</a>
    <nav class="links">
      <a data-nav="home" href="index.html">Home</a>
      <a data-nav="board" href="board.html">Board</a>
      <a data-nav="admin" href="admin.html">Questions</a>
    </nav>
  </header>
  <main class="wrap" style="max-width:760px">
    <h1 style="font-size:3rem">QUESTIONS</h1>
    <p>Surveys stay in this browser. You can also upload them to Supabase.</p>
    <form id="form" class="panel">
      <label>Question<textarea id="question" rows="2" required placeholder="Name something people forget on a trip"></textarea></label>
      <div id="answers"></div>
      <button class="gold" style="margin-top:14px" type="submit">Save question</button>
    </form>
    <section class="panel" style="margin-top:16px">
      <h2>Saved here</h2>
      <div id="list"></div>
      <div class="actions">
        <button id="export" type="button">Download</button>
        <button id="print-all" type="button">Print all</button>
        <label class="file-label">Import JSON<input id="import" type="file" accept="application/json" /></label>
      </div>
    </section>
    <section class="panel" style="margin-top:16px">
      <h2>Optional Supabase</h2>
      <p>Table <code>surveys</code> with columns <code>id</code> text, <code>question</code> text, <code>answers</code> jsonb. See README.md for the SQL.</p>
      <label>Project URL<input id="url" placeholder="https://your-project.supabase.co" /></label>
      <label>Anon key<input id="key" placeholder="eyJ..." /></label>
      <div class="actions">
        <button id="upload" class="gold" type="button">Upload</button>
        <button id="download" type="button">Download</button>
      </div>
      <p id="note" class="note"></p>
    </section>
  </main>
  <script>
    document.getElementById("answers").innerHTML = Array.from({ length: 8 }, (_, i) => `
      <div class="grid8">
        <input data-answer placeholder="Answer ${i + 1}" />
        <input data-points type="number" min="0" placeholder="0" />
      </div>`).join("");
  </script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function findSurveys() {
        for (var i = 0; i < localStorage.length; i++) {
          try {
            var v = JSON.parse(localStorage.getItem(localStorage.key(i)));
            if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" && "question" in v[0] && "answers" in v[0]) return v;
          } catch (e) {}
        }
        return [];
      }

      function normalizeAnswer(a) {
        if (a == null) return null;
        var text, pts;
        if (typeof a === "string") { text = a; pts = ""; }
        else if (Array.isArray(a)) { text = a[0]; pts = a[1]; }
        else {
          text = a.text != null ? a.text : a.answer != null ? a.answer : a.label != null ? a.label : a.name;
          pts = a.points != null ? a.points : a.score != null ? a.score : a.value;
        }
        text = String(text == null ? "" : text).trim();
        if (!text) return null;
        return { text: text, points: Number(pts) || 0 };
      }

      function printAll() {
        var surveys = findSurveys();
        if (!surveys.length) { alert("No saved questions found in this browser."); return; }

        var body = surveys.map(function (s, qi) {
          var answers = (s.answers || []).map(normalizeAnswer).filter(Boolean);
          var total = answers.reduce(function (n, a) { return n + a.points; }, 0);
          var rows = answers.map(function (a, ai) {
            return "<tr><td class='n'>" + (ai + 1) + "</td><td>" + esc(a.text) + "</td><td class='p'>" + a.points + "</td></tr>";
          }).join("");
          return "<section><h2>" + (qi + 1) + ". " + esc(s.question) + "</h2>" +
            "<table><thead><tr><th class='n'>#</th><th>Answer</th><th class='p'>Points</th></tr></thead><tbody>" + rows +
            "</tbody><tfoot><tr><td></td><td>Total</td><td class='p'>" + total + "</td></tr></tfoot></table></section>";
        }).join("");

        var w = window.open("", "_blank");
        if (!w) { alert("Please allow pop-ups to print."); return; }
        w.document.write(
          "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Family Feud - All Questions</title><style>" +
          "body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:24px}" +
          "h1{margin:0 0 4px}.meta{color:#555;margin:0 0 20px;font-size:14px}" +
          "section{margin-bottom:22px;page-break-inside:avoid}" +
          "h2{font-size:17px;margin:0 0 6px}" +
          "table{width:100%;border-collapse:collapse;font-size:14px}" +
          "th,td{border:1px solid #999;padding:5px 8px;text-align:left}" +
          "th{background:#eee}.n{width:40px;text-align:center}.p{width:80px;text-align:right}" +
          "tfoot td{font-weight:bold;background:#f6f6f6}" +
          "</style></head><body><h1>Family Feud</h1><p class='meta'>" + surveys.length + " question(s) &middot; " +
          new Date().toLocaleDateString() + "</p>" + body + "</body></html>"
        );
        w.document.close();
        w.focus();
        setTimeout(function () { w.print(); }, 300);
      }

      document.getElementById("print-all").addEventListener("click", printAll);
    })();
  </script>
</body>
</html>
